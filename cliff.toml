[changelog]
body = """
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
commit_parsers = [
  { message = "^(feat|fix|perf)", group = "changes" },
  { message = ".*", skip = true },
]

[bump]
no_increment_regex = "^(build|chore|ci|docs|refactor|style|test)$"
