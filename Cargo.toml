[package]
name = "rust-claude"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
crossterm = "0.29"
futures = "0.3.34"
getrandom = "0.4.3"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"
tokio = { version = "1", features = ["full"] }
tui-markdown = "0.3.10"
