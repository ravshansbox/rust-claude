name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
      - run: npm install --global @ast-grep/cli
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - id: latest
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "$GITHUB_SHA is no longer the latest commit on main, skipping release"
          fi
      - id: version
        if: steps.latest.outputs.latest
        run: |
          next=$(git cliff --bumped-version)
          next=${next#v}
          if git rev-parse --quiet --verify "refs/tags/v$next" >/dev/null; then
            echo "No commits that change the version since v$next, skipping release"
          else
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.version
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git cliff --unreleased --tag "v$VERSION" --strip all > notes.md
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"rust-coding-agent\"$/{n;s/^version = .*/version = \"$VERSION\"/}" Cargo.lock
          git -c user.name=release -c user.email=release@localhost commit --quiet --all --message "chore(release): v$VERSION"
          git archive --format=zip --prefix=rust-coding-agent/ --output=rust-coding-agent.zip HEAD
          (umask 077 && printf '%s\n' "$MINISIGN_KEY" > "$RUNNER_TEMP/minisign.key")
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m rust-coding-agent.zip -t "rust-coding-agent v$VERSION" < /dev/null
          rm "$RUNNER_TEMP/minisign.key"
          minisign -V -P RWSa19cgsH6sJ8TomZ0rN68H2QSZmUNhCpxJtnW6IQW/gn6XDhilg5A8 -m rust-coding-agent.zip
          sed -n 2p rust-coding-agent.zip.minisig | grep -q '^RU'
          gh release create "v$VERSION" rust-coding-agent.zip rust-coding-agent.zip.minisig --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
