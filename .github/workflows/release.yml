name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  release:
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - id: version
        run: |
          next=$(git cliff --bumped-version)
          next=${next#v}
          if git rev-parse --quiet --verify "refs/tags/v$next" >/dev/null; then
            echo "No commits that change the version since v$next, skipping release"
          else
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
          sed -i "/^name = \"rust-claude\"$/{n;s/^version = .*/version = \"$VERSION\"/}" Cargo.lock
          git -c user.name=release -c user.email=release@localhost commit --quiet --all --message "chore(release): v$VERSION"
          git archive --format=zip --prefix=rust-claude/ --output=rust-claude.zip HEAD
          gh release create "v$VERSION" rust-claude.zip --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
